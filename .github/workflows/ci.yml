name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Validate plugin
        run: make check-plugin

  release-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos:
          - darwin
          - linux
        goarch:
          - amd64
          - arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: >-
          make release-build
          TARGET_OSES=${{ matrix.goos }}
          TARGET_ARCHES=${{ matrix.goarch }}
          VERSION=${{ github.ref_name }}
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: weeek_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/weeek_${{ matrix.goos }}_${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: weeek_*
          path: dist
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t binaries < <(find dist -maxdepth 1 -type f -name 'weeek_*' | sort)
          if [[ "${#binaries[@]}" -ne 4 ]]; then
            echo "expected 4 release binaries, found ${#binaries[@]}" >&2
            exit 1
          fi
          for binary in "${binaries[@]}"; do
            filename="${binary##*/}"
            (cd dist && sha256sum "$filename" > "$filename.sha256")
          done
      - name: Create GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/weeek_*
          --verify-tag
          --generate-notes
