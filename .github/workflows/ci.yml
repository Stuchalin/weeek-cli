name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Validate plugin
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            WEEEK_PLUGIN_VERSION="${GITHUB_REF_NAME#v}" make check-plugin
          else
            make check-plugin
          fi

  release-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos:
          - darwin
          - linux
        goarch:
          - amd64
          - arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build
        shell: bash
        env:
          WEEEK_RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$WEEEK_RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "invalid release tag: $WEEEK_RELEASE_VERSION" >&2
            exit 1
          fi
          VERSION="$WEEEK_RELEASE_VERSION" make release-build \
            TARGET_OSES=${{ matrix.goos }} \
            TARGET_ARCHES=${{ matrix.goarch }}
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weeek_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/weeek_${{ matrix.goos }}_${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: weeek_*
          path: dist
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t binaries < <(find dist -maxdepth 1 -type f -name 'weeek_*' | sort)
          if [[ "${#binaries[@]}" -ne 4 ]]; then
            echo "expected 4 release binaries, found ${#binaries[@]}" >&2
            exit 1
          fi
          for binary in "${binaries[@]}"; do
            filename="${binary##*/}"
            (cd dist && sha256sum "$filename" > "$filename.sha256")
          done
      - name: Create GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/weeek_*
          --verify-tag
          --generate-notes
